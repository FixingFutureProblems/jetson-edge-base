# Jetson Edge Base – automatische Netzwerksteuerung
#
# Die SSID des Management-Access-Points wird automatisch aus dem
# statischen Hostnamen gebildet:
#
#   jetson-001 -> jetson-001-wlan

LAN_INTERFACE="enP8p1s0"
WIFI_INTERFACE="wlP1p1s0"

LAN_ENABLED="yes"
WIFI_CLIENT_ENABLED="yes"
ACCESS_POINT_ENABLED="yes"

ACCESS_POINT_SUFFIX="-wlan"
ACCESS_POINT_ADDRESS="192.168.50.1/24"

# Wartezeiten nach Aktivierungsversuchen
LAN_WAIT_SECONDS="8"
WIFI_WAIT_SECONDS="20"

# Dauerhafte Überwachung der Netzwerkzustände
MONITOR_INTERVAL_SECONDS="10"

# Im AP-Modus wird in diesem Abstand erneut versucht,
# ein bekanntes WLAN zu verbinden.
#
# Dabei muss der AP kurz beendet werden, weil das WLAN-Gerät nicht
# gleichzeitig im AP- und Client-Modus arbeiten kann.
WIFI_RETRY_SECONDS="300"
